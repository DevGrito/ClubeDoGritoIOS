<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Clube do Grito</title>
    <link rel="manifest" href="/manifest.json" />
    <script type="module" crossorigin src="/assets/index-DdGNOQgC.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BKn7bBpb.css">
  <link rel="manifest" href="/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/registerSW.js"></script></head>
  <body>
    <div id="root">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: system-ui, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);">
        <div id="loading-spinner" style="width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #fff; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p id="loading-text" style="margin-top: 20px; color: #fff; font-size: 16px;">Carregando Clube do Grito...</p>
        <p id="loading-error" style="margin-top: 10px; color: #ff6b6b; font-size: 14px; display: none;"></p>
      </div>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        body { margin: 0; padding: 0; }
      </style>
    </div>
    <script>
      // Fallback: se módulo não carregar em 15s, mostrar mensagem
      setTimeout(function() {
        var loadingText = document.getElementById('loading-text');
        var loadingError = document.getElementById('loading-error');
        if (loadingText && loadingText.textContent.includes('Carregando')) {
          loadingText.textContent = 'Tente abrir em uma nova aba';
          loadingText.style.color = '#ffd93d';
          if (loadingError) {
            loadingError.textContent = 'Copie a URL e cole em outra aba do navegador';
            loadingError.style.display = 'block';
          }
        }
      }, 15000);
    </script>
    <link rel="apple-touch-icon" href="/assets/logo192.png" />
  </body>
</html>
